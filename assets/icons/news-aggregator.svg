<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="64"
   height="64"
   viewBox="0 0 64 64"
   version="1.1">
  <!--
    Icona monocroma Breeze per News Aggregator.
    Conforme alle linee guida KDE Plasma: 1 colore, tratto uniforme,
    leggibile a 16px e 64px.
  -->
  <defs>
    <style type="text/css" id="current-color-scheme">
      .ColorScheme-Text {
        color: #eff0f1;
      }
      .ColorScheme-PositiveText {
        color: #27ae60;
      }
    </style>
  </defs>

  <!-- Sfondo trasparente: l'icona si adatta al tema -->

  <!-- Simbolo RSS: arco + punto -->
  <g
     transform="translate(8,8)"
     stroke="currentColor"
     class="ColorScheme-Text"
     stroke-width="3.5"
     stroke-linecap="round"
     stroke-linejoin="round"
     fill="none">
    <!-- Arco esterno -->
    <path d="M 6 42 A 30 30 0 0 1 42 6" />
    <!-- Arco medio -->
    <path d="M 6 42 A 18 18 0 0 1 30 18" />
    <!-- Punto centrale -->
    <circle cx="9" cy="39" r="3.5" fill="currentColor" stroke="none" />
  </g>

  <!-- Simbolo raccolta: due righe di testo stilizzate -->
  <g
     transform="translate(34,34)"
     fill="currentColor"
     class="ColorScheme-Text">
    <rect x="0" y="2"  width="22" height="2.5" rx="1" />
    <rect x="0" y="10" width="22" height="2.5" rx="1" />
    <rect x="0" y="18" width="14" height="2.5" rx="1" />
  </g>
</svg>
