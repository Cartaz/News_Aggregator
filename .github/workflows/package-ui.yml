name: Package UI test bundle

on:
  pull_request:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build UI bundle
        run: |
          mkdir -p bundle/config
          cp -a ui bundle/ui
          cp config/theme.py bundle/config/theme.py
      - name: Upload UI bundle
        uses: actions/upload-artifact@v4
        with:
          name: news-aggregator-neumorphism-test
          path: bundle/
          if-no-files-found: error
