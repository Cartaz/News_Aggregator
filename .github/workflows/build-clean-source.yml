name: Build clean News Aggregator source archive

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate source syntax
        shell: bash
        run: python -m compileall -q main.py config core ui tests

      - name: Build pristine source tree
        shell: bash
        run: |
          rm -rf /tmp/news_aggregator
          mkdir -p /tmp/news_aggregator
          rsync -a ./ /tmp/news_aggregator/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='__pycache__/' \
            --exclude='.pytest_cache/' \
            --exclude='*.pyc' \
            --exclude='PATCH_README.md' \
            --exclude='install.sh' \
            --exclude='PKGBUILD' \
            --exclude='apply_neumorphism_refactor.py' \
            --exclude='verify_neumorphism_v5.py' \
            --exclude='README_NEUMORPHISM_V5.md' \
            --exclude='SHA256SUMS' \
            --exclude='CLEAN_ARCHIVE.b64'

          cat > /tmp/news_aggregator/CLEAN_INSTALL.md <<'EOF'
          # News Aggregator - installazione pulita

          Questo archivio contiene direttamente i sorgenti completi. Non serve
          applicare patch, refactor script o installer intermedi.

          ## Installazione

          ```bash
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python main.py
          ```

          ## Test

          ```bash
          .venv/bin/python -m compileall -q main.py config core ui tests
          .venv/bin/pytest tests
          ```

          La UI include direttamente il refactor Dark Neumorphism con accento
          #FF6600.
          EOF

          cd /tmp
          zip -qr "$GITHUB_WORKSPACE/news_aggregator_clean_full.zip" news_aggregator

      - uses: actions/upload-artifact@v4
        with:
          name: news_aggregator_clean_full
          path: news_aggregator_clean_full.zip
          if-no-files-found: error
          retention-days: 1
