name: Build clean News Aggregator source archive

on:
  push:
    branches:
      - artifact-clean-neumorphism-v5-20260820

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate source syntax
        shell: bash
        run: python -m compileall -q main.py config core ui tests

      - name: Build pristine source tree
        shell: bash
        run: |
          rm -rf /tmp/news_aggregator_clean
          mkdir -p /tmp/news_aggregator_clean
          rsync -a ./ /tmp/news_aggregator_clean/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='__pycache__/' \
            --exclude='.pytest_cache/' \
            --exclude='*.pyc' \
            --exclude='PATCH_README.md' \
            --exclude='install.sh' \
            --exclude='PKGBUILD' \
            --exclude='apply_neumorphism_refactor.py' \
            --exclude='verify_neumorphism_v5.py' \
            --exclude='README_NEUMORPHISM_V5.md' \
            --exclude='SHA256SUMS' \
            --exclude='CLEAN_ARCHIVE.b64'

          cat > /tmp/news_aggregator_clean/CLEAN_INSTALL.md <<'EOF'
          # News Aggregator - installazione pulita

          Questo archivio contiene direttamente i sorgenti completi. Non serve
          applicare patch, refactor script o installer intermedi.

          ## Installazione

          ```bash
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python main.py
          ```

          ## Test

          ```bash
          .venv/bin/python -m compileall -q main.py config core ui tests
          .venv/bin/pytest tests
          ```

          La UI include direttamente il refactor Dark Neumorphism con accento
          #FF6600.
          EOF

          cd /tmp
          zip -qr news_aggregator_clean.zip news_aggregator_clean
          base64 -w 0 news_aggregator_clean.zip > "$GITHUB_WORKSPACE/CLEAN_ARCHIVE.b64"

      - name: Publish archive payload on temporary branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CLEAN_ARCHIVE.b64
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Store clean source archive [skip ci]"
          git push
