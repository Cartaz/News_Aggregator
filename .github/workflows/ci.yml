name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Core, contracts and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Qt import runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check installer syntax
        run: bash -n install.sh

      - name: Check Python syntax
        run: python -m compileall -q main.py config core ui tests

      - name: Check JavaScript syntax
        run: |
          node --check ui/web/state.js
          node --check ui/web/articles.js
          node --check ui/web/dialogs.js
          node --check ui/web/app.js

      - name: Run core and contract tests
        run: >-
          python -m pytest -q
          --ignore=tests/test_ui/test_webengine_e2e.py
          --ignore=tests/test_ui/test_window_restore_e2e.py

  webengine-e2e:
    name: QtWebEngine end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      QT_QPA_PLATFORM: xcb
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu --disable-dev-shm-usage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install headless Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libegl1 libgl1 libgbm1 libnss3 libfontconfig1 \
            libdbus-1-3 libasound2t64 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xfixes0 libxcb-xkb1

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run real WebEngine UI tests
        run: >-
          xvfb-run -a -s "-screen 0 1280x800x24"
          python -m pytest -q
          tests/test_ui/test_webengine_e2e.py
          tests/test_ui/test_window_restore_e2e.py
