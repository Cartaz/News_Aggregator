name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Core, QML contracts and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libfontconfig1

      - name: Install runtime through canonical installer
        run: |
          chmod +x install.sh
          ./install.sh

      - name: Install development dependencies
        run: .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Check installer syntax
        run: bash -n install.sh

      - name: Check Python syntax
        run: .venv/bin/python -m compileall -q main.py config core ui tests

      - name: Run core and contract tests
        run: .venv/bin/python -m pytest -q --ignore=tests/test_ui/test_qml_e2e.py

  qml-e2e:
    name: Qt Quick end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      QT_QPA_PLATFORM: xcb
      QSG_RHI_BACKEND: opengl
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install headless Qt Quick runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libegl1 libgl1 libgl1-mesa-dri libfontconfig1 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0 libxcb-xkb1

      - name: Install application and test dependencies
        run: |
          chmod +x install.sh
          ./install.sh
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Run real Qt Quick UI tests
        run: >-
          xvfb-run -a -s "-screen 0 1280x800x24"
          .venv/bin/python -m pytest -q tests/test_ui/test_qml_e2e.py
