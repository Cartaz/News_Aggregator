<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>News Aggregator</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="log-viewer.css">
</head>
<body>
  <div id="app" class="app-shell" aria-busy="true">
    <header class="topbar raised" role="banner">
      <div class="brand" aria-label="News Aggregator">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg>
        </div>
        <div>
          <strong id="app-name">News Aggregator</strong>
          <span id="scope-caption" class="muted">Tutti gli articoli</span>
        </div>
      </div>

      <div class="search-field inset-field">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
        <label class="sr-only" for="search-input">Cerca negli articoli</label>
        <input id="search-input" type="search" autocomplete="off" placeholder="Cerca titolo, fonte o testo…">
        <kbd>Ctrl F</kbd>
      </div>

      <div class="top-actions">
        <button id="refresh-all-btn" class="icon-button" type="button" aria-label="Aggiorna tutti i feed" title="Aggiorna tutti (Ctrl+R)">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M18.5 10A7 7 0 0 0 6.2 7.2L4 10M5.5 14A7 7 0 0 0 17.8 16.8L20 14"/></svg>
        </button>
        <button id="settings-btn" class="icon-button" type="button" aria-label="Impostazioni" title="Impostazioni">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 13.5v-3l-2-.7-.5-1.2.9-1.9-2.1-2.1-1.9.9-1.2-.5L11.5 3h-3L7.8 5l-1.2.5-1.9-.9-2.1 2.1.9 1.9L3 9.8l-2 .7v3l2 .7.5 1.2-.9 1.9 2.1 2.1 1.9-.9 1.2.5.7 2h3l.7-2 1.2-.5 1.9.9 2.1-2.1-.9-1.9.5-1.2z"/></svg>
        </button>
      </div>
      <div id="refresh-track" class="refresh-track" hidden aria-label="Progresso aggiornamento">
        <div id="refresh-fill" class="refresh-fill"></div>
      </div>
    </header>

    <div class="workspace">
      <aside id="source-panel" class="source-panel raised" aria-label="Sorgenti e categorie">
        <div class="panel-heading">
          <div>
            <span class="eyebrow">Raccolta</span>
            <h1>Sorgenti</h1>
          </div>
          <button id="add-feed-btn" class="icon-button active-accent" type="button" aria-label="Aggiungi feed" title="Aggiungi feed (Ctrl+N)">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>

        <nav id="source-nav" class="source-nav" aria-label="Navigazione feed">
          <button class="source-row selected" type="button" data-scope="all" data-id="">
            <span class="source-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM8 9h8M8 13h8M8 17h5"/></svg></span>
            <span class="source-label">Tutti gli articoli</span>
            <span id="all-unread" class="count-badge" aria-label="Articoli non letti">0</span>
          </button>
          <div id="category-list" class="nav-group"></div>
          <div class="nav-divider"></div>
          <div id="feed-list" class="nav-group"></div>
        </nav>

        <div id="feed-actions" class="feed-actions inset-panel" hidden>
          <div class="selected-feed-meta">
            <strong id="selected-feed-title"></strong>
            <span id="selected-feed-status" class="muted"></span>
          </div>
          <div class="compact-actions">
            <button id="refresh-feed-btn" class="text-button" type="button">Aggiorna</button>
            <button id="edit-feed-btn" class="text-button" type="button">Modifica</button>
            <button id="remove-feed-btn" class="text-button danger-neutral" type="button">Rimuovi</button>
          </div>
        </div>
      </aside>

      <div id="sidebar-resizer" class="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="Ridimensiona pannello sorgenti" tabindex="0"></div>

      <main class="content" id="main-content">
        <section class="content-header raised-soft" aria-labelledby="content-title">
          <div>
            <span class="eyebrow">Vista corrente</span>
            <h2 id="content-title">Tutti gli articoli</h2>
            <p id="content-meta" class="muted">0 articoli</p>
          </div>
          <div class="view-controls">
            <label class="toggle-control" for="unread-toggle">
              <span>Solo non letti</span>
              <input id="unread-toggle" type="checkbox">
              <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
            </label>
          </div>
        </section>

        <section class="article-layout" aria-label="Articoli">
          <div class="article-list-panel raised">
            <div id="article-list" class="article-list" role="listbox" aria-label="Elenco articoli" tabindex="0"></div>
            <div id="article-empty" class="empty-state" hidden>
              <svg class="empty-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 9h8M8 13h8M8 17h5"/></svg>
              <strong>Nessun articolo da mostrare</strong>
              <span class="muted">Aggiorna i feed o modifica i filtri.</span>
            </div>
          </div>

          <article id="article-detail" class="article-detail raised" aria-live="polite">
            <div id="detail-placeholder" class="empty-state detail-placeholder">
              <svg class="empty-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l3 3v15H6zM15 3v4h4M9 11h6M9 15h6"/></svg>
              <strong>Seleziona un articolo</strong>
              <span class="muted">Il contenuto testuale apparirà qui.</span>
            </div>
            <div id="detail-content" hidden>
              <div class="detail-topline">
                <span id="detail-source" class="source-pill"></span>
                <span id="detail-date" class="muted"></span>
              </div>
              <h2 id="detail-title"></h2>
              <p id="detail-author" class="muted"></p>
              <div class="detail-rule"></div>
              <p id="detail-summary" class="detail-summary"></p>
              <div class="detail-actions">
                <button id="open-link-btn" class="action-button active-accent" type="button">
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5M10 14l9-9M18 13v6H5V6h6"/></svg>
                  Apri nel browser
                </button>
                <button id="mark-read-btn" class="action-button" type="button">Segna come letto</button>
              </div>
            </div>
          </article>
        </section>
      </main>
    </div>
  </div>

  <div id="modal-backdrop" class="modal-backdrop" hidden>
    <section id="modal" class="modal raised" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <div>
          <span id="modal-eyebrow" class="eyebrow"></span>
          <h2 id="modal-title"></h2>
        </div>
        <button id="modal-close" class="icon-button" type="button" aria-label="Chiudi finestra">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </section>
  </div>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="state.js"></script>
  <script src="articles.js"></script>
  <script src="dialogs.js"></script>
  <script src="app.js"></script>
</body>
</html>
